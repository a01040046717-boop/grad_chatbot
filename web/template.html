<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW융합대학 졸업요건 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 학사 행정 도구: 차분한 남색 바탕 + 졸업 인증 '도장' 같은 주홍 포인트. 좌측 작업영역 / 우측 기준·결과 패널 */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #18213a;
  --muted: #5d6680;
  --line: #dbe0ea;
  --accent: #1f4fb8;
  --accent-soft: #e6edfb;
  --stamp: #d2512c;
  --ok: #1f8a5b; --ok-soft: #e3f4ec;
  --bad: #c2372b; --bad-soft: #fbe9e7;
  --warn: #a8690b; --warn-soft: #fbf1df;
  --font-display: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --surface: #1a2030; --ink: #e8ebf3; --muted: #9aa3ba; --line: #2c3448;
    --accent: #7ea2f2; --accent-soft: #1f2b47; --stamp: #f08463;
    --ok: #5fcf98; --ok-soft: #173327; --bad: #f28b80; --bad-soft: #3a1d1b; --warn: #e8b45a; --warn-soft: #362a14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #1a2030; --ink: #e8ebf3; --muted: #9aa3ba; --line: #2c3448;
  --accent: #7ea2f2; --accent-soft: #1f2b47; --stamp: #f08463;
  --ok: #5fcf98; --ok-soft: #173327; --bad: #f28b80; --bad-soft: #3a1d1b; --warn: #e8b45a; --warn-soft: #362a14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; padding: 18px 0 0; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.brand .seal { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 700; margin-right: 8px; transform: rotate(-3deg); vertical-align: 3px; }
.profile { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
select, input[type="number"], textarea, input[type="text"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
select { padding-right: 28px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on { color: var(--ok); border-color: var(--ok); } .chip.on .dot { background: var(--ok); }
.chip.off { color: var(--warn); border-color: var(--warn); } .chip.off .dot { background: var(--warn); }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; }
nav.tabs a { padding: 10px 16px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-color: var(--accent); }

main { padding: 22px 0 40px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel-h h2 { font-size: 16px; }
.panel-b { padding: 14px 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
aside.sticky { position: sticky; top: 12px; }

/* chat */
.chat { display: flex; flex-direction: column; min-height: 560px; }
.msgs { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 64vh; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
.msg h3, .msg h4 { font-size: 15px; margin: 8px 0 4px; }
.msg table { border-collapse: collapse; font-size: 13px; margin: 6px 0; display: block; overflow-x: auto; }
.msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.msg code { background: var(--accent-soft); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.msg pre { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); padding: 8px; border-radius: 6px; font-size: 12.5px; margin: 6px 0; }
.cite { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; }
.meta { margin-top: 8px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.meta details summary { cursor: pointer; }
.meta li { margin: 2px 0; }
.thinking { color: var(--muted); font-style: italic; }
/* Colab 모드: AI 답변(스트리밍) + 안내문에서 바로 찾은 내용 */
.ai-part { border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 10px; }
.part-h { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.part-h .muted { font-weight: 400; }
.doc-part { border-left: 3px solid var(--line); padding-left: 10px; }
.doc-part .part-h { color: var(--muted); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.caret::after { content: "▌"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.colab .msgs { max-height: 520px; }
.colab .chat { min-height: 0; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.examples button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.composer form { display: flex; gap: 8px; }
.composer textarea { flex: 1; resize: none; min-height: 46px; }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }

/* requirement summary */
.total { display: flex; align-items: baseline; gap: 8px; }
.total b { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.kinds div { background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.kinds strong { display: block; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.kinds.cats { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
.mx-wrap { overflow-x: auto; margin: 12px 0 4px; }
.mx { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mx th, .mx td { border: 1px solid var(--line); padding: 5px 3px; text-align: center; white-space: nowrap; }
.mx { font-size: 12px; }
.mx thead th { background: var(--bg); color: var(--muted); font-weight: 600; }
.mx tbody th { text-align: left; font-weight: 600; white-space: nowrap; background: var(--bg); }
.mx td.tot, .mx th.tot { font-weight: 700; color: var(--stamp); }
.mx tr.miss th { color: var(--bad); }
.mx td.neg { color: var(--bad); font-weight: 700; }
.grp { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 13px; font-weight: 700; }
.grp b { font-variant-numeric: tabular-nums; }
.kinds.k2 { grid-template-columns: repeat(2, 1fr); margin-top: 6px; }
.kinds.k3 { grid-template-columns: repeat(3, 1fr); margin-top: 6px; }
.kinds.k4 { grid-template-columns: repeat(4, 1fr); margin-top: 6px; }
.bar.top .lab { color: var(--ink); font-weight: 700; }
.bar.sub { padding-left: 10px; }
.bar.sub .track { height: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.cat { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.cat.c0 { color: var(--stamp); background: var(--bad-soft); }
.cat.c1 { color: var(--accent); background: var(--accent-soft); }
.cat.c2 { color: var(--ok); background: var(--ok-soft); }
.req-group h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.req-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.req-list li { display: flex; justify-content: space-between; gap: 10px; }
.req-list .pt { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

/* checker */
.check-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .check-grid { grid-template-columns: 1fr; } }
.course-box textarea { width: 100%; min-height: 150px; resize: vertical; }
.credit-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.credit-in input { width: 110px; }
.credit-box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; display: grid; gap: 4px; }
.credit-box .lab { display: flex; justify-content: space-between; align-items: baseline; }
.credit-box .track { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.credit-box .fill { height: 100%; background: var(--warn); }
.credit-box.ok .fill { background: var(--ok); }
.parsed { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 6px; }
.kind-block { border-top: 1px solid var(--line); }
.kind-block > h3 { font-size: 14px; padding: 12px 16px 4px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 8px 16px; align-items: center; border-left: 3px solid transparent; }
.item.done { border-left-color: var(--ok); }
.item .name { font-size: 14px; }
.item .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
.item .ctrl { display: flex; gap: 8px; align-items: center; justify-content: end; flex-wrap: wrap; }
.item input[type="number"] { width: 76px; text-align: right; }
.item label.cb { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.subs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
.subs label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.subs input[type="number"] { width: 64px; }
.score { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 1px 8px; margin-left: 4px; white-space: nowrap; }
.score.part { color: var(--warn); background: var(--warn-soft); }
.score.full { color: var(--ok); background: var(--ok-soft); }
.auto { font-size: 12px; color: var(--ok); font-weight: 500; }
.verdict { display: flex; align-items: center; gap: 12px; }
.stamp { font: 700 15px/1 var(--font-display); border: 3px solid currentColor; border-radius: 8px; padding: 8px 10px; transform: rotate(-4deg); }
.stamp.pass { color: var(--ok); } .stamp.fail { color: var(--bad); }
.bars { display: grid; gap: 8px; margin: 14px 0; }
.bar { font-size: 12.5px; }
.bar .lab { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar .fill { height: 100%; background: var(--accent); }
.bar.full .fill { background: var(--ok); }
.missing { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.missing li { background: var(--bad-soft); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.missing li b { color: var(--bad); font-variant-numeric: tabular-nums; }
.missing .d { display: block; color: var(--muted); font-size: 12px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 0 16px 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
footer { color: var(--muted); font-size: 12px; padding: 16px 0 30px; border-top: 1px solid var(--line); }
footer a { color: var(--accent); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <h1><span class="seal">인증</span>SW융합대학 졸업요건 챗봇</h1>
        <p>2026 학과별 다면적 졸업인증제 안내문 기반 RAG 질의응답 · 졸업 자가진단</p>
      </div>
      <div class="profile">
        <div class="field"><label for="dept">학과</label><select id="dept"></select></div>
        <div class="field"><label for="year">학번</label><select id="year"></select></div>
        <span id="mode" class="chip"><span class="dot"></span>AI 연결 확인 중</span>
      </div>
    </div>
    <nav class="tabs" aria-label="화면 전환">
      <a href="#chat" id="tab-chat">질문하기</a>
      <a href="#check" id="tab-check">졸업 자가진단</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ 질문하기 ============ -->
  <section id="view-chat" class="grid">
    <div class="panel chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="composer">
        <div class="examples" id="examples"></div>
        <form id="ask-form">
          <textarea id="q" rows="2" placeholder="예) 학과활동은 몇 번 해야 해? / 인간사랑, 예비창업설계 들었는데 졸업 가능해?" aria-label="질문"></textarea>
          <button class="btn" id="send" type="submit">보내기</button>
        </form>
      </div>
    </div>
    <aside class="panel sticky" id="req-panel"></aside>
  </section>

  <!-- ============ 자가진단 ============ -->
  <section id="view-check" class="check-grid" hidden>
    <div class="panel">
      <div class="panel-h"><h2>수강한 교과목</h2><span class="muted small">들은 과목 이름만 적으면 됩니다</span></div>
      <div class="panel-b course-box">
        <label for="courses" class="small muted">한 줄에 한 과목씩 적어 주세요 (쉼표로 구분해도 됩니다).</label>
        <textarea id="courses" placeholder="인간사랑&#10;현대기본영어&#10;봉사학습&#10;예비창업설계"></textarea>
        <div class="parsed" id="parsed"></div>
        <div class="credit-in"><label for="credits" class="small muted">총 이수학점 <span class="muted">(선택 · 졸업학점 130학점 확인용)</span></label>
          <input type="number" id="credits" min="0" max="200" step="1" placeholder="예) 115" inputmode="numeric"></div>
      </div>
      <div class="panel-h" style="border-top:1px solid var(--line)"><h2>비교과 활동 · 이수 항목</h2><button class="btn ghost" id="reset" type="button">입력 초기화</button></div>
      <div id="form"></div>
    </div>
    <aside class="panel sticky" id="result"></aside>
  </section>
</main>

<footer class="wrap">
  공식 이수내역은 <a href="https://st.sch.ac.kr">차세대 종합정보시스템</a> → 학부학사행정 → 졸업 → 개인별졸업진도관리 → 비교과일람표에서 확인하세요.
  문의: 多Dream비교과센터 (향설 1관 RC306호). 이 페이지는 안내문을 바탕으로 한 자가진단 도구이며 공식 판정이 아닙니다.
</footer>

<script type="application/json" id="req-data">/*REQ*/</script>
<script type="application/json" id="chunk-data">/*CHUNKS*/</script>
<script>
/*CORE*/
</script>
<script>
const REQ = JSON.parse(document.getElementById("req-data").textContent);
const INDEX = buildIndex(JSON.parse(document.getElementById("chunk-data").textContent));
const DEPTS = Object.keys(REQ.departments);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CAT_SHORT = { "소통하는 공감인재": "공감인재", "융합하는 창의인재": "창의인재", "공헌하는 글로벌인재": "글로벌인재" };
const fmt = (n) => (Math.round(n * 100) / 100).toString();

const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const state = {
  dept: store.get("grad.dept", "AI·빅데이터학과"),
  year: store.get("grad.year", 2022),
  history: [],          // [{role, content}]
  acts: {}, touched: false, lastCheck: null, view: "table",
  records: {},          // 채팅으로 말한 이수 기록 (학과|학번 별 누적)
  credits: null,        // 자가진단 탭의 총 이수학점
  busy: false,
};
if (!DEPTS.includes(state.dept)) state.dept = "AI·빅데이터학과";

/* ---------------- 프로필 ---------------- */
function yearsFor(dept) {
  const ys = [];
  for (const t of REQ.departments[dept].tracks) for (let y = t.years[0]; y <= t.years[1]; y++) ys.push(y);
  return ys;
}
function fillProfile() {
  $("#dept").innerHTML = DEPTS.map((d) => `<option ${d === state.dept ? "selected" : ""}>${esc(d)}</option>`).join("");
  const ys = yearsFor(state.dept);
  if (!ys.includes(state.year)) state.year = ys.includes(2022) ? 2022 : ys[ys.length - 1];
  $("#year").innerHTML = ys.map((y) => `<option value="${y}" ${y === state.year ? "selected" : ""}>${y}학번 (${String(y).slice(2)}학번)</option>`).join("");
}
$("#dept").addEventListener("change", (e) => { state.dept = e.target.value; onProfile(); });
$("#year").addEventListener("change", (e) => { state.year = +e.target.value; onProfile(); });
function onProfile() {
  fillProfile(); store.set("grad.dept", state.dept); store.set("grad.year", state.year);

/* ---------------- 이수현황표 (학교 시스템과 같은 형식) ---------------- */
function matrixTable(r, needOnly = false) {
  const cols = GROUPS.flatMap((g) => Object.keys(r.matrix[g]).map((c) => [g, c]));
  const tot = { required: r.totalRequired ?? r.total, earned: r.totalEarned ?? 0 };
  const rows = needOnly ? [["필요점수", (v) => v.required, ""]]
    : [["필요점수 ⓐ", (v) => v.required, ""], ["이수점수 ⓑ", (v) => v.earned, ""], ["미이수 ⓐ-ⓑ", (v) => Math.max(v.required - v.earned, 0), "miss"]];
  return `<div class="mx-wrap"><table class="mx">
    <thead><tr><th rowspan="2">구분</th>${GROUPS.map((g) => `<th colspan="3">${g}</th>`).join("")}<th rowspan="2" class="tot">졸업점수</th></tr>
    <tr>${cols.map(([, c]) => `<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([lab, f, cls]) => `<tr class="${cls}"><th>${lab}</th>${cols.map(([g, c]) => { const x = f(r.matrix[g][c]);
      return `<td class="${cls && x > 0 ? "neg" : ""}">${fmt(x)}</td>`; }).join("")}<td class="tot ${cls && f(tot) > 0 ? "neg" : ""}">${fmt(f(tot))}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

/* ---------------- 자가진단 폼 ---------------- */
function renderForm() {
  const s = getRequirementItems(state.dept, state.year, REQ);
  if (s.error) { $("#form").innerHTML = `<div class="panel-b">${esc(s.error)}</div>`; return; }
  const html = [];
  if (s.warnings.length) html.push(`<div class="warnbox">${s.warnings.map(esc).join("<br>")}</div>`);
  for (const [k, pts] of Object.entries(s.sections)) {
    const its = s.items.filter((i) => i.section === k);
    html.push(`<div class="kind-block"><h3><span>${k.replace("·", " · ")}</span><span class="muted small">${fmt(pts)}점</span></h3>`);
    for (const it of its) {
      const id = `f-${it.id}`;
      let ctrl = "", extra = "", hint = it.note || "";
      if (it.type === "course") { ctrl = `<span class="auto" id="${id}-auto" hidden>수강 리스트에서 확인</span><label class="cb"><input type="checkbox" id="${id}" data-id="${it.id}" data-t="bool">이수</label>`; hint = hint || "수강 리스트에 있으면 자동 인정, 이름이 다르면 직접 체크"; }
      else if (it.type === "check") ctrl = `<label class="cb"><input type="checkbox" id="${id}" data-id="${it.id}" data-t="bool">이수/참여</label>`;
      else if (it.type === "all_of") ctrl = it.parts.map((pt, j) => `<label class="cb"><input type="checkbox" id="${id}-p${j}" data-id="${it.id}" data-t="part" value="${esc(pt)}">${esc(pt)}</label>`).join("");
      else if (it.type === "count") { ctrl = `<input type="number" min="0" max="99" value="0" id="${id}" data-id="${it.id}" data-t="int" aria-label="${esc(it.name)} 횟수"><span class="small muted">회</span>`; hint = `회당 ${it.per}점 · ${Math.ceil(it.points / it.per)}회 필요`; }
      else if (it.type === "choose") {
        const opts = [...(it.options || []), ...(it.substitutes || [])];
        hint = opts.length ? `${it.n}과목 필요 · 수강 리스트에 없으면 아래에서 선택` : `수강 리스트에서 '${it.pattern}'이 들어간 과목을 셉니다 · ${it.n}과목 필요`;
        if (opts.length) extra = `<div class="subs">${opts.map((o, j) => `<label><input type="checkbox" id="${id}-${j}" data-id="${it.id}" data-t="list" value="${esc(o)}">${esc(o)}</label>`).join("")}</div>`;
      } else if (it.type === "points" && !(it.subitems || []).length) {
        ctrl = `<input type="number" min="0" max="${it.points}" step="0.5" value="0" id="${id}-other" data-id="${it.id}" data-t="other" aria-label="${esc(it.name)} 취득 점수"><span class="small muted">점</span>`;
        hint = it.note || "비교과일람표에 인정된 점수를 입력하세요";
      } else if (it.type === "points") {
        hint = it.note || "해당하는 세부 활동을 입력하면 점수가 합산됩니다";
        extra = `<div class="subs">${(it.subitems || []).map((sb, j) => {
          const sid = `${id}-s${j}`;
          if (sb.mode === "select") return `<label>${esc(sb.name)} <select id="${sid}" data-id="${it.id}" data-t="sub" data-sub="${esc(sb.name)}">${Object.entries(sb.options).map(([k, v]) => `<option value="${esc(k)}">${esc(k)}${v ? ` (+${v})` : ""}</option>`).join("")}</select></label>`;
          if (sb.mode === "check") return `<label><input type="checkbox" id="${sid}" data-id="${it.id}" data-t="sub" data-sub="${esc(sb.name)}">${esc(sb.name)} (+${sb.points})</label>`;
          if (sb.mode === "count") return `<label>${esc(sb.name)} <input type="number" min="0" value="0" id="${sid}" data-id="${it.id}" data-t="sub" data-sub="${esc(sb.name)}"> × ${sb.per}점</label>`;
          return `<label>${esc(sb.name)} <input type="number" min="0" value="0" id="${sid}" data-id="${it.id}" data-t="sub" data-sub="${esc(sb.name)}"></label>`;
        }).join("")}<label>기타 인정 점수 <input type="number" min="0" value="0" id="${id}-other" data-id="${it.id}" data-t="other"></label></div>`;
      } else if (it.type === "topcit_rule") {
        ctrl = `<label class="small">응시 <input type="number" min="0" value="0" id="${id}-att" data-id="${it.id}" data-t="att">회</label>
                <label class="small">최고 수준 <select id="${id}-lv" data-id="${it.id}" data-t="lv">${[0, 1, 2, 3, 4, 5].map((l) => `<option value="${l}">Lv${l}</option>`).join("")}</select></label>`;
        hint = "응시 5회 / 응시 3회+Lv2 / 응시 1회+Lv3 / Lv4 중 하나";
      }
      html.push(`<div class="item" id="row-${it.id}"><span class="name"><span class="cat c${CATEGORIES.indexOf(it.category)}">${CAT_SHORT[it.category].replace("인재", "")}</span>${esc(it.name)} <span class="score" id="sc-${it.id}">0 / ${fmt(it.points)}점</span></span><span class="ctrl">${ctrl}</span>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}${extra}</div>`);
    }
    html.push(`</div>`);
  }
  $("#form").innerHTML = html.join("");
}

function collectActs() {
  const acts = {};
  document.querySelectorAll("#form [data-id]").forEach((el) => {
    const id = el.dataset.id, t = el.dataset.t;
    if (t === "bool") acts[id] = el.checked;
    else if (t === "int") acts[id] = +el.value || 0;
    else if (t === "list" || t === "part") { acts[id] = acts[id] || []; if (el.checked) acts[id].push(el.value); }
    else if (t === "sub") { acts[id] = acts[id] || { subitems: {}, other: 0 }; acts[id].subitems[el.dataset.sub] = el.type === "checkbox" ? el.checked : el.tagName === "SELECT" ? el.value : +el.value || 0; }
    else if (t === "other") { acts[id] = acts[id] || { subitems: {}, other: 0 }; acts[id].other = +el.value || 0; }
    else if (t === "att") { acts[id] = acts[id] || {}; acts[id].attempts = +el.value || 0; }
    else if (t === "lv") { acts[id] = acts[id] || {}; acts[id].level = +el.value || 0; }
  });
  return acts;
}

/* 총 이수학점 → 졸업학점(학칙 제33조) 확인. 다면적 졸업인증과 별개의 요건이라 따로 표시 */
function creditBox() {
  if (state.credits === null) return "";
  const total = ((REQ.meta || {}).grad_credits || {}).total || 130, left = total - state.credits, p = Math.min(100, (state.credits / total) * 100);
  return `<div class="credit-box ${left <= 0 ? "ok" : ""}"><div class="lab"><span>졸업학점 <span class="muted small">학칙 제33조</span></span><b>${fmt(state.credits)} / ${total}학점</b></div>
    <div class="track"><div class="fill" style="width:${p}%"></div></div>
    <div class="small muted">${left <= 0 ? "충족" : `${fmt(left)}학점 부족`} · 다면적 졸업인증과 별개의 졸업요건</div></div>`;
}

function recompute() {

  if (r.error) { $("#result").innerHTML = `<div class="panel-b">${esc(r.error)}</div>`; return; }
  for (const it of r.items) {
    const row = document.getElementById(`row-${it.id}`); if (row) row.classList.toggle("done", it.passed);
    const sc = document.getElementById(`sc-${it.id}`);
    if (sc) { sc.textContent = `${fmt(it.earned)} / ${fmt(it.required)}점`; sc.className = "score " + (it.passed ? "full" : it.earned > 0 ? "part" : ""); }
    const auto = document.getElementById(`f-${it.id}-auto`);
    if (auto) {
      const isAuto = it.detail === "수강 리스트에서 확인";

      auto.hidden = !isAuto;
      if (isAuto) { cb.checked = true; cb.disabled = true; cb.dataset.auto = "1"; }

    }
  }
  $("#result").innerHTML = `
    <div class="panel-h"><h2>판정 결과</h2><span class="muted small">${esc(r.department)} ${r.year}학번</span></div>
    <div class="panel-b">
      <div class="verdict"><div class="total"><b>${fmt(r.totalEarned)}</b><span class="muted">/ ${fmt(r.totalRequired)}점</span></div>
        <span class="stamp ${r.passed ? "pass" : "fail"}">${r.passed ? "졸업인증 충족" : "미충족"}</span></div>
      <div class="seg" role="tablist" aria-label="점수 보기 기준">
        <button type="button" class="${state.view === "table" ? "on" : ""}" data-view="table">이수현황표</button>
        <button type="button" class="${state.view === "kind" ? "on" : ""}" data-view="kind">구분별</button>
        <button type="button" class="${state.view === "cat" ? "on" : ""}" data-view="cat">인재상별</button>
      </div>
      ${creditBox()}
      ${state.view === "table" ? matrixTable(r) : `<div class="bars">${(state.view === "cat" ? CATEGORIES.map((c) => [CAT_SHORT[c], r.byCategory[c], ""])
        : GROUPS.flatMap((g) => [[g, r.byGroup[g], "top"], ...Object.entries(r.byKind).filter(([k]) => k.startsWith(g)).map(([k, v]) => ["└ " + k.split("·")[1], v, "sub"])])).map(([k, v, cls]) => {
        const p = v.required ? Math.min(100, (v.earned / v.required) * 100) : 100;
        return `<div class="bar ${cls} ${p >= 100 ? "full" : ""}"><div class="lab"><span>${k}</span><span>${fmt(v.earned)} / ${fmt(v.required)}</span></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`; }).join("")}</div>`}
      ${r.missing.length ? `<h3 class="small" style="margin:0 0 6px">부족한 항목 ${r.missing.length}개</h3><ul class="missing">${r.missing.map((m) =>
        `<li>${esc(m.name)} <b>−${fmt(m.need)}점</b><span class="d">${esc(m.section)} · ${esc(CAT_SHORT[m.category])} · ${esc(m.detail)}</span></li>`).join("")}</ul>` : `<p>모든 항목을 채웠습니다. 비교과일람표에서 공식 이수내역을 확인하세요.</p>`}
      ${r.unmatchedCourses.length ? `<p class="note">졸업인증 항목과 관계없는 과목: ${r.unmatchedCourses.map(esc).join(", ")}</p>` : ""}
      <div class="actions"><button class="btn" id="ask-missing" type="button">부족한 부분 챗봇에게 묻기</button></div>
    </div>`;
  document.querySelectorAll("#result .seg button").forEach((b) => b.onclick = () => { state.view = b.dataset.view; recompute(); });
  $("#ask-missing").onclick = () => { state.touched = true; location.hash = "#chat"; ask("자가진단 결과에서 부족한 항목을 어떻게 채우면 되는지 우선순위대로 알려줘."); };
}
$("#courses").addEventListener("input", () => { state.touched = true; store.set("grad.courses", $("#courses").value); recompute(); });

  state.touched = true; store.set("grad.credits", v); recompute(); });

/* ---------------- 마크다운 (간단) ---------------- */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[문서\s*(\d+)\]/g, '<span class="cite">문서 $1</span>')
    .replace(/&lt;&lt;(.+?)&gt;&gt;/g, '<span class="cite">$1</span>')
    .replace(/(^|\s)_(.+?)_(?=\s|$)/g, '$1<em class="muted">$2</em>');
}
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, j) => `<tr>${cells(r).map((c) => j === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`); continue; }
    if (/^#{1,4}\s/.test(l)) { out.push(`<h4>${inline(l.replace(/^#+\s/, ""))}</h4>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) { const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(```|\s*\||#{1,4}\s|\s*([-*•]|\d+[.)])\s+)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

/* Colab 모드: 노트북 커널(파이썬)의 무료 오픈소스 LLM 에 연결 (google.colab.kernel.invokeFunction) */
function colabKernel() {
  for (const w of [window, window.parent]) {
    try { if (w && w.google && w.google.colab && w.google.colab.kernel) return w.google.colab.kernel; } catch (e) {}
  }
  return null;
}
const KERNEL = colabKernel();
let COLAB_MODEL = null;
async function colabCall(name, args) {
  const r = await KERNEL.invokeFunction(name, args, {});
  return r && r.data ? r.data["application/json"] : null;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

}

function addMsg(role, html) {
  const d = document.createElement("div"); d.className = `msg ${role}`; d.innerHTML = html;
  $("#msgs").appendChild(d); $("#msgs").scrollTop = $("#msgs").scrollHeight; return d;
}
function metaHtml(hits, tools) {
  const src = hits.length ? `<details><summary>근거 문서 ${hits.length}개</summary><ol>${hits.map((h) =>
    `<li>${esc(h.chunk.location)} <span class="muted">(${esc(h.chunk.source)})</span></li>`).join("")}</ol></details>` : "";
  const tl = tools.length ? `<div>도구 호출: ${tools.map((t) => `<code>${esc(t)}</code>`).join(" → ")}</div>` : "";
  return src || tl ? `<div class="meta">${tl}${src}</div>` : "";
}

    inputSchema: { type: "object", properties: { department: { type: "string" }, admission_year: { type: "integer" },
      courses: { type: "array", items: { type: "string" } }, activities: { type: "object" } }, required: ["department", "admission_year"] },

/* AI가 없을 때: 검색된 청크에서 질문과 가장 가까운 '줄'만 골라 보여준다 (추출형 답변) */
const META_CHUNK = INDEX.chunks.find((c) => c.location === "일반 안내");
function keyLines(q, hits, n = 5) {
  const strip = q.replace(/(\d{2,4})\s*학번/g, "");
  const qv = INDEX.vec(charWbNgrams(strip));
  const cand = [];
  // 줄 단위 추출은 학과 기준표(구조화)와 일반 안내에서만. 공식안내 문서(.md)는 섹션 통째로 보여준다
  const pool = [...hits.map((h) => h.chunk).filter((c) => !c.location.startsWith("p.") && !c.source.endsWith(".md")), META_CHUNK].filter(Boolean);
  for (const c of pool) for (const line of c.text.split("\n")) {
    const t = line.replace(/^-\s*/, "").trim();
    if (t.length < 4 || /^(#|\[.*\]$|출처|\|[\s:|-]+\|$)/.test(t)) continue;   // 제목·출처·표 구분선 제외
    const lv = INDEX.vec(charWbNgrams(t)); let s = 0;
    for (const [g, w] of qv) { const x = lv.get(g); if (x) s += x * w; }
    cand.push({ t, s, loc: c.location });
  }
  const seen = new Set();
  cand.sort((a, b) => b.s - a.s);
  const cut = Math.max(0.05, (cand[0]?.s || 0) * 0.6);   // 가장 관련 높은 줄 대비 상대 기준
  return cand.filter((x) => x.s >= cut && !seen.has(x.t) && seen.add(x.t)).slice(0, n);
}

function bestLineScore(q, c) {
  const qv = INDEX.vec(charWbNgrams(q.replace(/(\d{2,4})\s*학번/g, "")));
  let best = 0;
  for (const line of c.text.split("\n")) {
    const t = line.replace(/^-\s*/, "").trim();
    if (t.length < 4 || /^(#|\[.*\]$|출처)/.test(t)) continue;
    const lv = INDEX.vec(charWbNgrams(t)); let sc = 0;
    for (const [g, w] of qv) { const x = lv.get(g); if (x) sc += x * w; }
    if (sc > best) best = sc;
  }
  return best;
}

/* 졸업 자가진단 탭의 입력을 판정용 기록으로 (과목 리스트 + 체크·횟수·점수 + 총 이수학점) */
const STATUS_Q = /부족|충족|남은|남았|모자|채워|채우|졸업\s*(가능|할\s*수|돼|되)|현황|(내|지금|현재)\s*(점수|몇\s*점)|뭐\s*더|뭘\s*더|더\s*해야|우선순위|판정/;
function cleanActs(acts) {
  const out = {};
  for (const [k, v] of Object.entries(acts || {})) {
    if (v === true || (typeof v === "number" && v > 0) || (Array.isArray(v) && v.length)) out[k] = v;
    else if (v && typeof v === "object" && !Array.isArray(v)) {
      const subs = Object.fromEntries(Object.entries(v.subitems || {}).filter(([, x]) => x === true || (typeof x === "number" && x > 0) || (typeof x === "string" && x)));
      if (Object.keys(subs).length || +v.other > 0 || +v.attempts > 0 || +v.level > 0) out[k] = v.subitems ? { ...v, subitems: subs } : v;
    }
  }
  return out;
}
function tabRecord(dept, year) {
  if (resolveDepartment(state.dept, REQ) !== dept || +state.year !== +year) return null;
  const rec = { dept, year, courses: parseCourseList($("#courses").value), activities: cleanActs(collectActs()), credits: state.credits };
  return hasAny(rec) ? rec : null;
}
function combineRecords(tab, chat) {
  return { dept: tab.dept, year: tab.year, courses: [...new Set([...tab.courses, ...chat.courses])],
    activities: { ...tab.activities, ...chat.activities }, credits: chat.credits ?? tab.credits };
}

function autoJudgeMarkdown(auto) {
  if (auto.status) return [`**물어본 항목의 현재 기록** (${auto.res.department} ${auto.res.year}학번)`, "", ...auto.status.map((l) => `- ${l}`), "",
    `_지금까지 자가진단 탭에 입력하거나 대화로 말한 내용 기준 · 총점 ${fmt(auto.res.totalEarned)}/${fmt(auto.res.totalRequired)}점. 기록이 없는 항목은 '미수강'이 아니라 아직 확인되지 않은 것이에요._`].join("\n");
  if (auto.reset) return "대화로 말씀하신 이수 기록을 모두 지웠어요. 들은 과목과 활동을 다시 말씀해 주세요." + (auto.tab ? " (졸업 자가진단 탭에 입력한 내용은 그대로예요.)" : "");
  const r = auto.res, cols = GROUPS.flatMap((g) => Object.keys(r.matrix[g]).map((c) => [g, c]));
  const L = [`**지금까지 입력·말씀하신 내용으로 계산한 졸업인증 판정** (${r.department} ${r.year}학번)`,
    `반영한 내용(${auto.tab && auto.chat ? "자가진단 탭 입력 + 대화로 말한 내용" : auto.tab ? "자가진단 탭 입력" : "대화 누적"}): ` + auto.rec.join(", "), "",
    `**총점 ${fmt(r.totalEarned)} / ${fmt(r.totalRequired)}점 → ${r.passed ? "충족" : "미충족"}**`, "",
    "| 구분 | " + cols.map(([g, c]) => `${g.slice(0, 2)} ${c}`).join(" | ") + " | 졸업점수 |",
    "|---|" + cols.map(() => "---").join("|") + "|---|",
    "| 필요 | " + cols.map(([g, c]) => fmt(r.matrix[g][c].required)).join(" | ") + ` | ${fmt(r.totalRequired)} |`,
    "| 이수 | " + cols.map(([g, c]) => fmt(r.matrix[g][c].earned)).join(" | ") + ` | ${fmt(r.totalEarned)} |`];
  if (r.missing.length) { L.push("", `**아직 채우지 못한 항목 ${r.missing.length}개** (모두 표시 · 입력하거나 말하지 않은 항목도 여기에 들어가요)`);
    r.missing.forEach((m) => L.push(`- ${m.name}: ${fmt(m.need)}점 부족 (${m.detail === "미이수" ? "아직 확인 안 됨" : m.detail})`)); }
  if (auto.credit) L.push("", `**${auto.credit.split(" (")[0]}** (다면적 졸업인증과 별개의 졸업요건)`);
  L.push("", "_이어서 말해도 돼요: “봉사학습도 들었어”, “학과활동 2번 더 했어”, “총 115학점이야”, “처음부터 다시”_");
  return L.join("\n");
}

/* 전체 기준 질문 → 선택한 학과·학번의 구분별 항목 목록 */
function overviewMarkdown(q) {
  const [qd, qy] = detectProfile(q, REQ);
  const dept = qd || state.dept, year = qy || state.year;
  const s = getRequirementItems(dept, year, REQ);
  if (s.error) return s.error;
  const L = [`**${s.department} ${year}학번: 총 ${fmt(s.total)}점 필요**`, ""];
  for (const sec of Object.keys(s.sections)) {
    const its = s.items.filter((i) => i.section === sec);
    L.push(`- **${sec}** ${fmt(s.sections[sec])}점: ` + its.map((i) => `${i.name} ${fmt(i.points)}${i.type === "count" ? `(회당 ${fmt(i.per)}점)` : ""}`).join(", "));
  }
  const cats = {};
  for (const i of s.items) cats[i.category] = (cats[i.category] || 0) + i.points;
  L.push("", "인재상별: " + Object.entries(cats).map(([c, v]) => `${c} ${fmt(v)}점`).join(" · "));
  return L.join("\n");
}

function offlineAnswer(q, hits, auto, footer = true) {
  const parts = [];
  const wantsCheck = /졸업\s*가능|충족|부족|남은|모자|채우/.test(q);
  if (auto) { parts.push(autoJudgeMarkdown(auto)); return parts.join("\n\n"); }
  if (wantsCheck && state.touched && state.lastCheck && !state.lastCheck.error)
    parts.push(`**자가진단 결과**\n\`\`\`\n${formatResultText(state.lastCheck)}\n\`\`\``);
  else if (wantsCheck) parts.push("졸업 가능 여부는 **졸업 자가진단** 탭에서 과목과 활동을 입력하면 바로 계산돼요.");
  const [fd, fy] = detectProfile(q, REQ);
  const facts = itemFacts(q, fd || state.dept, fy || state.year, REQ);
  if (facts.length) parts.push(`**${resolveDepartment(fd || state.dept, REQ) || state.dept} ${fy || state.year}학번 · 질문한 항목의 기준** (항목마다 점수가 달라요)\n` + facts.map((f) => `- ${f}`).join("\n"));
  const wantsAll = /전체|기준|요건|알려/.test(q) && !/몇|어디|뭐|무엇/.test(q) && !facts.length;
  const ov = /전체|총점|모든 항목|졸업\s*요건|인증\s*기준/.test(q) && !/몇\s*번|어디/.test(q) ? overviewMarkdown(q) : null;
  if (ov) { parts.push(ov); if (footer) parts.push("_검색 모드: 졸업인증 기준표에서 찾아 보여드렸어요._"); return parts.join("\n\n"); }
  const lines = facts.length ? [] : keyLines(q, hits, wantsAll ? 0 : 5);   // 항목 기준이 있으면 다른 학번·항목 줄은 섞지 않음
  // 공식안내 문서(.md) 섹션이 상위에 걸리면 그 섹션 전체(표 포함)를 보여준다
  const isMd = (loc) => hits.some((h) => h.chunk.location === loc && h.chunk.source.endsWith(".md"));
  const topScore = Math.max(...hits.map((h) => h.score));
  // 공식안내·추가자료 섹션 후보 중 '질문과 가장 잘 맞는 문장'을 가진 섹션을 고른다
  const mdHit = hits.filter((h) => h.chunk.source.endsWith(".md") && h.score >= (facts.length ? 0.8 : 0.5) * topScore)
    .map((h) => [h, bestLineScore(q, h.chunk)]).sort((a, b) => b[1] - a[1]).map((x) => x[0])[0];
  if (mdHit) {
    const sec = mdHit.chunk;
    const other = lines.filter((l) => !isMd(l.loc)).slice(0, 2);
    if (other.length) parts.push(`**${state.dept} ${state.year}학번 기준표**\n` + other.map((l) => `- ${l.t} <<${l.loc}>>`).join("\n"));
    const body = sec.text.split("\n").filter((l) => !/^\[.*\]$/.test(l.trim()) && !/^##\s/.test(l)).join("\n");
    parts.push(`**${sec.location}** <<${sec.source.replace(/\.md$/, "")}>>\n\n${body}`);
  } else if (lines.length) {
    parts.push(`**${state.dept} ${state.year}학번 기준으로 안내문에서 찾은 내용이에요.**`);
    parts.push(lines.map((l) => `- ${l.t} <<${l.loc}>>`).join("\n"));
  } else if (!facts.length) {
    const top = hits.find((h) => !h.chunk.location.startsWith("p.")) || hits[0];
    if (top) parts.push(`**[문서 1] ${top.chunk.location}**\n\`\`\`\n${top.chunk.text.slice(0, 1200)}\n\`\`\``);
  }
  if (footer) parts.push("_검색 모드: 안내문에서 질문과 가장 가까운 내용을 찾아 보여드렸어요._");
  return parts.join("\n\n");
}

async function ask(q) {
  q = q.trim(); if (!q || state.busy) return;
  state.busy = true; $("#send").disabled = true; $("#q").value = "";
  addMsg("user", esc(q).replace(/\n/g, "<br>"));
  const hits = search(INDEX, q, 5, state.dept, state.year, REQ);
  // 졸업 판정 요청이면 문장에서 과목·활동을 규칙으로 인식해 판정 엔진으로 계산
  // 대화 누적: 이번 문장에서 인식한 과목·활동·이수학점을 지금까지의 기록에 합쳐 판정
  let auto = null;
  const [qd, qy] = detectProfile(q, REQ);
  const jd = qd || state.dept, jy = qy || (qd && qd !== state.dept ? null : state.year);
  if (jy) {
    const spec = getRequirementItems(jd, jy, REQ);
    if (!spec.error) {
      const key = `${spec.department}|${jy}`, base = state.records[key] || newRecord(spec.department, jy);
      const e = extractInputs(q, jd, jy, REQ);
      const said = wantsJudgement(q, e, base, spec);
      const tab = tabRecord(spec.department, jy);           // 졸업 자가진단 탭에 체크·입력한 내용
      const asked = isStatusQuestion(q) ? askedItemIds(q, spec) : [];
      if (asked.length) {   // '인간사랑 수강했어?' → 물어본 항목만, 지금까지의 기록(탭 + 대화)으로 답함
        const all = tab ? combineRecords(tab, base) : base;
        const r = checkGraduation(jd, jy, all.courses, all.activities, REQ);
        if (!r.error) auto = { status: statusLines(r, asked), res: r, record: all, tab: !!tab };
      } else if (said || (tab && STATUS_Q.test(q))) {
        const rec = said ? mergeRecord(base, e, q, spec) : base; state.records[key] = rec;
        if (said && RESET_RE.test(q) && !hasAny(rec)) auto = { reset: true, tab: !!tab };
        else {
          // 판정은 항상 '자가진단 탭 입력 + 대화로 말한 내용'을 합쳐서 (탭에서 체크한 항목을 미이수로 보지 않도록)
          const all = tab ? combineRecords(tab, rec) : rec;
          if (hasAny(all)) { const r = checkGraduation(jd, jy, all.courses, all.activities, REQ);
            if (!r.error) auto = { rec: describeRecord(all, spec), res: r, record: all, credit: creditLine(all.credits, REQ), tab: !!tab, chat: hasAny(rec) }; }
        }
      }
    }
  }
  const bubble = addMsg("bot", `<span class="thinking">문서를 찾는 중…</span>`);
  if (KERNEL && COLAB_MODEL && !aiOff) { await askColab(q, hits, auto, bubble); return; }
  const sample = aiOff ? null : await getSample();
  let text = "", sources = [...hits], trace = [];
  if (!sample) {
    setMode(false);
    text = offlineAnswer(q, hits, auto);
  } else {
    const ctx = [`[학생 프로필] 학과: ${state.dept}, 학번: ${state.year}`];
    if (state.touched && state.lastCheck && !state.lastCheck.error) ctx.push(`[학생이 자가진단 탭에서 입력한 최근 판정 결과]\n${formatResultText(state.lastCheck)}`);
    if (auto && auto.res) ctx.push(`[학생 문장에서 자동 인식한 입력과 판정 결과 (판정 엔진 계산값)]\n인식한 입력: ${auto.rec.join(", ")}\n${formatResultText(auto.res)}\n→ 이 계산값을 사용해 답하라. 인식되지 않은 항목이 있으면 check_graduation 도구로 다시 계산하라.`);
    const final = `${PROMPT}\n\n${ctx.join("\n\n")}\n\n[참고 문서]\n${formatContext(hits)}\n\n[질문]\n${q}`;
    const messages = [...state.history.slice(-8), { role: "user", content: final }];
    try {
      const res = await sample(messages, { tools: TOOLS(sources, trace), cache: false, modelTier: "default",
        onText: ({ text: t }) => { bubble.innerHTML = t ? md(t) : `<span class="thinking">답변을 정리하는 중…</span>`; $("#msgs").scrollTop = $("#msgs").scrollHeight; } });
      text = res.text || "";
    } catch (e) {
      if (e && e.code === "not_granted") { aiOff = true; setMode(false); text = offlineAnswer(q, hits, auto); }
      else if (e && e.code === "rate_limited") text = "질문이 몰려 잠시 답변할 수 없어요. 조금 뒤에 다시 보내 주세요.\n\n" + offlineAnswer(q, hits, auto);
      else text = (e && e.text) ? e.text : "답변을 만들지 못했어요. 다시 시도해 주세요.\n\n" + offlineAnswer(q, hits, auto);
    }
  }
  const seen = new Set(); sources = sources.filter((h) => { const k = h.chunk.id; if (seen.has(k)) return false; seen.add(k); return true; });
  bubble.innerHTML = md(text) + metaHtml(sources.slice(0, 6), trace);
  state.history.push({ role: "user", content: q }, { role: "assistant", content: text });
  state.busy = false; $("#send").disabled = false; $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

/* Colab: 안내문에서 찾은 내용은 즉시 보여주고, AI 답변은 생성되는 대로 위에 채운다 */
async function askColab(q, hits, auto, bubble) {
  // 근거 검색은 파이썬 하이브리드 검색(TF-IDF + 임베딩·FAISS)으로 다시 받아 화면과 AI가 같은 근거를 쓰게 한다
  try {
    const sr = await colabCall("grad.search", [q, state.dept, state.year]);
    const byId = Object.fromEntries(INDEX.chunks.map((c) => [c.id, c]));
    const ph = (sr || []).map((x) => ({ chunk: byId[x.id], score: x.score })).filter((h) => h.chunk);
    if (ph.length) hits = ph;
  } catch (e) {}
  const docHtml = `<div class="doc-part"><div class="part-h">📄 안내문에서 바로 찾은 내용</div>${md(offlineAnswer(q, hits, auto, false))}</div>`;
  const aiHead = (busy) => `<div class="part-h">🤖 AI 답변 <span class="muted">${esc(COLAB_MODEL)}</span>${busy ? ' <span class="spinner"></span>' : ""}</div>`;
  const render = (aiHtml, busy) => { bubble.innerHTML = `<div class="ai-part">${aiHead(busy)}${aiHtml}</div>${docHtml}`; };
  render(`<span class="thinking">답변을 만드는 중이에요…</span>`, true);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  const checkText = state.touched && state.lastCheck && !state.lastCheck.error
    ? formatResultText(state.lastCheck) + (state.credits !== null ? "\n" + creditLine(state.credits, REQ) : "") : "";
  let text = "", tools = [];
  try {
    const st = await colabCall("grad.start", [q, state.dept, state.year, state.history.slice(-4), checkText,
      auto && auto.record ? auto.record : null]);
    let last = null;
    for (let i = 0; i < 2400; i++) {               // 최대 약 10분
      await sleep(i < 10 ? 150 : 300);
      const s = await colabCall("grad.poll", [st.job]);
      if (!s) throw new Error("응답 없음");
      if (s.error) throw new Error(s.error);
      if (s.text !== last) {
        last = s.text; const at = $("#msgs").scrollHeight - $("#msgs").scrollTop - $("#msgs").clientHeight < 40;
        const busyMsg = /^⏳/.test(s.text || "");
        render(busyMsg ? `<span class="thinking">${esc(s.text.replace(/^⏳\s*/, ""))}</span>` : `<div class="${s.done ? "" : "caret"}">${md(s.text || "")}</div>`, !s.done);
        if (at) $("#msgs").scrollTop = $("#msgs").scrollHeight;
      }
      if (s.done) { text = s.text || ""; tools = s.tools || []; break; }
    }
  } catch (e) {
    text = `⚠️ AI 답변을 받지 못했어요 (${e.message || e}). Colab 런타임이 실행 중인지 확인해 주세요. 아래 안내문 내용은 그대로 확인할 수 있어요.`;
  }
  render(md(text), false);
  bubble.innerHTML += metaHtml(hits.slice(0, 6), tools);
  state.history.push({ role: "user", content: q }, { role: "assistant", content: text });
  state.busy = false; $("#send").disabled = false;
}

$("#ask-form").addEventListener("submit", (e) => { e.preventDefault(); ask($("#q").value); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($("#q").value); } });

  "인간사랑, 현대기본영어, 봉사학습, 예비창업설계 들었고 학과활동 3번, SQLD 땄어. 졸업 가능해?"];

위에서 학과와 학번을 고르면 그 기준으로 답합니다. 지금은 **${state.dept} ${state.year}학번**이고, 총 **${s.total ?? "-"}점**이 필요해요.

- 들은 과목과 참여한 활동을 적어 주면 졸업 가능 여부를 계산해 드려요.
- 체크박스로 하나씩 입력하려면 **졸업 자가진단** 탭을 쓰세요.`));
}
