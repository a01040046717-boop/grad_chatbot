<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW융합대학 졸업요건 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 학사 행정 도구: 차분한 남색 바탕 + 졸업 인증 '도장' 같은 주홍 포인트. 좌측 작업영역 / 우측 기준·결과 패널 */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #18213a;
  --muted: #5d6680;
  --line: #dbe0ea;
  --accent: #1f4fb8;
  --accent-soft: #e6edfb;
  --stamp: #d2512c;
  --ok: #1f8a5b; --ok-soft: #e3f4ec;
  --bad: #c2372b; --bad-soft: #fbe9e7;
  --warn: #a8690b; --warn-soft: #fbf1df;
  --font-display: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --surface: #1a2030; --ink: #e8ebf3; --muted: #9aa3ba; --line: #2c3448;
    --accent: #7ea2f2; --accent-soft: #1f2b47; --stamp: #f08463;
    --ok: #5fcf98; --ok-soft: #173327; --bad: #f28b80; --bad-soft: #3a1d1b; --warn: #e8b45a; --warn-soft: #362a14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #1a2030; --ink: #e8ebf3; --muted: #9aa3ba; --line: #2c3448;
  --accent: #7ea2f2; --accent-soft: #1f2b47; --stamp: #f08463;
  --ok: #5fcf98; --ok-soft: #173327; --bad: #f28b80; --bad-soft: #3a1d1b; --warn: #e8b45a; --warn-soft: #362a14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; padding: 18px 0 0; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.brand .seal { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 700; margin-right: 8px; transform: rotate(-3deg); vertical-align: 3px; }
.profile { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
select, input[type="number"], textarea, input[type="text"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
select { padding-right: 28px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on { color: var(--ok); border-color: var(--ok); } .chip.on .dot { background: var(--ok); }
.chip.off { color: var(--warn); border-color: var(--warn); } .chip.off .dot { background: var(--warn); }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; }
nav.tabs a { padding: 10px 16px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-color: var(--accent); }

main { padding: 22px 0 40px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-h { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel-h h2 { font-size: 16px; }
.panel-b { padding: 14px 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
aside.sticky { position: sticky; top: 12px; }

/* chat */
.chat { display: flex; flex-direction: column; min-height: 560px; }
.msgs { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 64vh; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
.msg h3, .msg h4 { font-size: 15px; margin: 8px 0 4px; }
.msg table { border-collapse: collapse; font-size: 13px; margin: 6px 0; display: block; overflow-x: auto; }
.msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.msg code { background: var(--accent-soft); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.msg pre { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); padding: 8px; border-radius: 6px; font-size: 12.5px; margin: 6px 0; }
.cite { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; }
.meta { margin-top: 8px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.meta details summary { cursor: pointer; }
.meta li { margin: 2px 0; }
.thinking { color: var(--muted); font-style: italic; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.examples button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.composer form { display: flex; gap: 8px; }
.composer textarea { flex: 1; resize: none; min-height: 46px; }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }

/* requirement summary */
.total { display: flex; align-items: baseline; gap: 8px; }
.total b { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.kinds div { background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.kinds strong { display: block; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.kinds.cats { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
.grp { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 13px; font-weight: 700; }
.grp b { font-variant-numeric: tabular-nums; }
.kinds.k2 { grid-template-columns: repeat(2, 1fr); margin-top: 6px; }
.kinds.k3 { grid-template-columns: repeat(3, 1fr); margin-top: 6px; }
.kinds.k4 { grid-template-columns: repeat(4, 1fr); margin-top: 6px; }
.bar.top .lab { color: var(--ink); font-weight: 700; }
.bar.sub { padding-left: 10px; }
.bar.sub .track { height: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.cat { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.cat.c0 { color: var(--stamp); background: var(--bad-soft); }
.cat.c1 { color: var(--accent); background: var(--accent-soft); }
.cat.c2 { color: var(--ok); background: var(--ok-soft); }
.req-group h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.req-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.req-list li { display: flex; justify-content: space-between; gap: 10px; }
.req-list .pt { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

/* checker */
.check-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .check-grid { grid-template-columns: 1fr; } }
.course-box textarea { width: 100%; min-height: 150px; resize: vertical; }
.parsed { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 6px; }
.kind-block { border-top: 1px solid var(--line); }
.kind-block > h3 { font-size: 14px; padding: 12px 16px 4px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 8px 16px; align-items: center; border-left: 3px solid transparent; }
.item.done { border-left-color: var(--ok); }
.item .name { font-size: 14px; }
.item .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
.item .ctrl { display: flex; gap: 8px; align-items: center; justify-content: end; flex-wrap: wrap; }
.item input[type="number"] { width: 76px; text-align: right; }
.item label.cb { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.subs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
.subs label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.subs input[type="number"] { width: 64px; }
.score { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 1px 8px; margin-left: 4px; white-space: nowrap; }
.score.part { color: var(--warn); background: var(--warn-soft); }
.score.full { color: var(--ok); background: var(--ok-soft); }
.auto { font-size: 12px; color: var(--ok); font-weight: 500; }
.verdict { display: flex; align-items: center; gap: 12px; }
.stamp { font: 700 15px/1 var(--font-display); border: 3px solid currentColor; border-radius: 8px; padding: 8px 10px; transform: rotate(-4deg); }
.stamp.pass { color: var(--ok); } .stamp.fail { color: var(--bad); }
.bars { display: grid; gap: 8px; margin: 14px 0; }
.bar { font-size: 12.5px; }
.bar .lab { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar .fill { height: 100%; background: var(--accent); }
.bar.full .fill { background: var(--ok); }
.missing { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.missing li { background: var(--bad-soft); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.missing li b { color: var(--bad); font-variant-numeric: tabular-nums; }
.missing .d { display: block; color: var(--muted); font-size: 12px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 0 16px 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
footer { color: var(--muted); font-size: 12px; padding: 16px 0 30px; border-top: 1px solid var(--line); }
footer a { color: var(--accent); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <h1><span class="seal">인증</span>SW융합대학 졸업요건 챗봇</h1>
        <p>2026 학과별 다면적 졸업인증제 안내문 기반 RAG 질의응답 · 졸업 자가진단</p>
      </div>
      <div class="profile">
        <div class="field"><label for="dept">학과</label><select id="dept"></select></div>
        <div class="field"><label for="year">학번</label><select id="year"></select></div>
        <span id="mode" class="chip"><span class="dot"></span>AI 연결 확인 중</span>
      </div>
    </div>
    <nav class="tabs" aria-label="화면 전환">
      <a href="#chat" id="tab-chat">질문하기</a>
      <a href="#check" id="tab-check">졸업 자가진단</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ 질문하기 ============ -->
  <section id="view-chat" class="grid">
    <div class="panel chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="composer">
        <div class="examples" id="examples"></div>
        <form id="ask-form">
          <textarea id="q" rows="2" placeholder="예) 학과활동은 몇 번 해야 해? / 인간사랑, 예비창업설계 들었는데 졸업 가능해?" aria-label="질문"></textarea>
          <button class="btn" id="send" type="submit">보내기</button>
        </form>
      </div>
    </div>
    <aside class="panel sticky" id="req-panel"></aside>
  </section>

  <!-- ============ 자가진단 ============ -->
  <section id="view-check" class="check-grid" hidden>
    <div class="panel">
      <div class="panel-h"><h2>수강한 교과목</h2><span class="muted small">성적표를 그대로 붙여넣어도 됩니다</span></div>
      <div class="panel-b course-box">
        <label for="courses" class="small muted">한 줄에 한 과목 (쉼표 구분도 가능). 학점·성적 표시는 자동으로 제거됩니다.</label>
        <textarea id="courses" placeholder="인간사랑 A+&#10;현대기본영어(2학점) B+&#10;봉사학습&#10;예비창업설계"></textarea>
        <div class="parsed" id="parsed"></div>
      </div>
      <div class="panel-h" style="border-top:1px solid var(--line)"><h2>비교과 활동 · 이수 항목</h2><button class="btn ghost" id="reset" type="button">입력 초기화</button></div>
      <div id="form"></div>
    </div>
    <aside class="panel sticky" id="result"></aside>
  </section>
</main>

<footer class="wrap">
  공식 이수내역은 <a href="https://st.sch.ac.kr">차세대 종합정보시스템</a> → 학부학사행정 → 졸업 → 개인별졸업진도관리 → 비교과일람표에서 확인하세요.
  문의: 多Dream비교과센터 (향설 1관 RC306호). 이 페이지는 안내문을 바탕으로 한 자가진단 도구이며 공식 판정이 아닙니다.

 4) TOPCITLv4 달성\n창의(7) 수준5(창의융합형) 850~1000", "source": "2026_다면적졸업인증제_SW융합대학.pdf", "location": "p.8 #3", "department": "", "years": []}, {"id": "6f7f363930b2", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 1. 졸업요건의 구성 (다면적졸업인증은 졸업요건 중 하나)\n\n- 순천향대학교 졸업요건에는 졸업학점, 졸업종합평가(시험/논문/작품 등), 다면적졸업인증, 봉사활동 등이 포함됩니다. 즉 다면적졸업인증 점수를 모두 채워도 졸업학점·졸업종합평가 등 다른 요건을 함께 충족해야 졸업할 수 있습니다.\n- 졸업요건의 근거는 학칙 제33조(졸업요건)입니다. 학칙에는 130학점 이상 취득(일부 학과·과정은 별도 학점 기준), 졸업논문(졸업종합시험, 졸업작품 등) 심사 합격, 교육단위별 졸업요건 충족 등이 규정되어 있고, 그 밖의 교육단위별 졸업요건은 따로 정합니다.\n- 졸업에 필요한 학점은 취득했지만 다른 졸업요건(예: 다면적졸업인증)을 충족하지 못하면 학사과정 수료로 처리되고, 이후 모든 졸업요건을 충족한 학기의 졸업일에 학위가 수여됩니다.\n- 본인의 졸업사정 결과는 포털사이트 → 학사인트라넷 → 학부학사행정에서 확인할 수 있습니다.\n\n출처: 순천향대학교 대학공지 「2026년 8월 졸업대상자 학사학위 취득유예(졸업유예) 신청 안내」(2026.07) https://home.sch.ac.kr/eng/03/0201.jsp?mode=view&article_no=20260715112125254005 / 순천향대학교 학칙 제33조(규정관리시스템 rule.sch.ac.kr)", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "1. 졸업요건의 구성 (다면적졸업인증은 졸업요건 중 하나)", "department": "", "years": []}, {"id": "43fc7c7d8aee", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 2. 전교생 SW 기초교육 이수 의무\n\n- 순천향대학교는 전교생에게 SW 기초교육을 의무로 운영합니다.\n- 공통교양 '컴퓨터코딩과문제해결'(2학점)과 중핵교양 'SW와AI' 영역(3학점)을 합쳐 총 5학점을 이수해야 합니다.\n- SW중심대학사업단은 SW학과 전공 이수학점을 93학점으로 확대 개편했다고 안내하고 있습니다. (학과·학번별 정확한 전공 이수학점은 학과 교육과정표에서 확인)\n\n출처: 순천향대학교 직속기관 SW중심대학사업단 소개 https://home.sch.ac.kr/sch/04/000600.jsp", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "2. 전교생 SW 기초교육 이수 의무", "department": "", "years": []}, {"id": "66f3e8fc09cf", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 3. AI·SW 전공역량 졸업인증제 (전공역량점수 200점)\n\nSW융합대학 학과의 다면적 졸업인증 기준표에 있는 'AI·SW전공역량졸업인증제' 항목의 세부 기준입니다. (의료IT공학과는 표에 '200점 이상'으로 표기)\n\n- 목적: SW전공 학생들이 다양한 전공 관련 비교과 활동에 참여하도록 독려하고, 산업체 수요를 반영한 기준을 졸업인증에 반영하기 위한 제도입니다.\n- 인증 기준: 아래 활동으로 얻은 전공역량점수 합계가 **200점 이상**이면 인증됩니다.\n- 인증요건은 인증자 비율, 취업 후 산업체 만족도, 산업체 수요 분석을 바탕으로 교과과정혁신위원회가 개선합니다.\n\n| 구분 | 인정 조건 | 전공역량점수 |\n|---|---|---|\n| 전공교과목 학점 | 전공 교과목 5과목을 B학점 이상으로 이수 | 100점 |\n| 산학협력프로젝트(캡스톤디자인) | 산업체 평가 '최우수' 또는 '우수' 획득 | 50점 |\n| 인턴십 | 국내·외 인턴십 기관 평가 80점 이상 | 국외 100점 / 국내 50점 |\n| 공모전·경진대회 | 교내·외 공모전 또는 경진대회 입상 | 교외 50점 / 교내 20점 |\n| 오픈소스SW활동 | 교내 오픈소스 SW동아리 활동 | 30점 |\n| 창업 | 전공 관련 창업동아리 활동 | 100점 |\n| 졸업논문 | 졸업논문 통과 | 100점 |\n| 졸업시험 | 졸업시험 80점 이상 | 100점 |\n| 연구논문 게재 | 국외·국내 학술지 논문 게재 | 국외 50점 / 국내 30점 |\n| 특허 출원 | 국내 특허 출원 | 50점 |\n| TOPCIT | TOPCIT 수준2 이상 | 50점 |\n\n- 예시: 전공 교과목 5과목 B 이상(100점) + 졸업논문 통과(100점) = 200점으로 인증 요건을 충족합니다.\n- 예시: 전공 교과목 5과목 B 이상(100점) + 교외 경진대회 입상(50점) + TOPCIT 수준2 이상(50점) = 200점.\n\n출처: 순천향대학교 SW중심대학사업단 「AI·SW 전공역량 졸업인증제」 https://home.sch.ac.kr/sw/02/050200.jsp", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "3. AI·SW 전공역량 졸업인증제 (전공역량점수 200점)", "department": "", "years": []}, {"id": "ad5c837ba84b", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 4. 코딩역량 인증제\n\nSW융합대학 학과의 다면적 졸업인증 기준표에 있는 '코딩역량인증제(Level2 이상)' 항목에 해당하는 대학 자체 인증 시험입니다.\n\n- 목적: SW전공 학생들의 실무 코딩 역량을 진단하고 높이기 위해 대학 차원에서 운영합니다.\n- 사용 언어: C/C++, JAVA, Python 중 선택\n- 시험 분야: 알고리즘\n- 문항: 10문항, 100점 만점\n- 등급: 레벨1, 레벨2, 레벨3\n- 사업단 안내 페이지의 인증요건: 70점 이상\n- 다면적 졸업인증 기준표(학과별)에서는 대부분 '코딩역량인증제 Level2 이상'을 요구하므로, 졸업인증 점수(5점)를 받으려면 레벨2 이상을 받아야 합니다. 레벨별 점수 구간은 사업단 공지를 확인하세요.\n\n출처: 순천향대학교 SW중심대학사업단 「코딩역량 인증제」 https://home.sch.ac.kr/sw/02/050300.jsp", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "4. 코딩역량 인증제", "department": "", "years": []}, {"id": "51ee3f8a598d", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 5. TOPCIT 정기평가 응시 혜택\n\n- TOPCIT 정기평가에 응시한 학생에게는 SW역량 마일리지 5점이 부여됩니다. (2026년 제25회 정기평가 공지 기준)\n- 같은 공지에서 다면적졸업인증 점수(창의 1점)는 사업단에서 일괄 부여한다고 안내했습니다. 이는 여러 학과 기준표의 'TOPCIT 응시(회당 1점)'와 같은 배점입니다.\n- 성적 우수자와 성적 향상자에게는 장학금이 지급됩니다. 장학금을 받으려면 TOPCIT 홈페이지(www.topcit.or.kr) → MY PAGE → 성적조회/인증서 발급에서 성적인증서를 내려받아 기한 내에 제출해야 합니다.\n- TOPCIT 장학금 문의: 041-530-4738\n\n출처: 순천향대학교 SW중심대학사업단 공지 「[AI전공교육센터] 제25회 TOPCIT 성적우수 및 향상 장학금 지급 안내」(2026.07.03) https://home.sch.ac.kr/sw/07/010000.jsp?mode=view&article_no=20260703165638209072", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "5. TOPCIT 정기평가 응시 혜택", "department": "", "years": []}, {"id": "c0e9c64e7479", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 6. 비교과자율활동 점수를 받을 수 있는 프로그램 예시 (2026학년도 2학기 공지)\n\n학과 기준표의 '비교과자율활동' 점수는 학교가 운영하는 다양한 비교과 프로그램에 참여해 채울 수 있습니다. 2026학년도 2학기 공지에 나온 예시는 다음과 같습니다. 프로그램과 점수는 학기마다 달라지므로 대학 공지사항을 확인하세요.\n\n- 프로젝트형 다문화 멘토링(향설교양대학 사회공헌나눔센터): 한 학기 10회기 1:1 멘토링과 필수 행사 3회에 참여하면 다면적 졸업인증 공감형 점수 5점과 봉사시간이 인정됩니다. 휴학생은 점수를 받을 수 없습니다.\n 출처: https://home.sch.ac.kr/sc/03/0101.jsp?mode=view&article_no=20260819092739830057\n- 향설열린강좌 청강(향설교양대학): 사전 청강 신청과 청강 후 서명을 완료한 재학생에게 다면적 졸업인증제 창의 점수 2점이 부여됩니다.\n 출처: https://home.sch.ac.kr/carbon/03/0201.jsp?mode=view&article_no=20260810165943620047\n- 비교과 프로그램 신청: 차세대 종합정보시스템 → 학부학사행정 → 비교과과정 → 신청관리 → 비교과신청", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "6. 비교과자율활동 점수를 받을 수 있는 프로그램 예시 (2026학년도 2학기 공지)", "department": "", "years": []}, {"id": "4fa6a2146ad1", "text": "[순천향대학교 졸업인증 관련 공식 안내 모음]\n## 7. ASP와 多Dream비교과센터\n\n- ASP(After School Program)는 1학년 학생이 참여하는 비교과 활동으로, 1인당 최소 1개의 동아리에 가입해 활동합니다. 학과 동아리와 중앙 동아리 등 약 400개의 동아리가 운영됩니다. 대학공통 필수 항목 'ASP(1,2학기)'가 이 활동입니다.\n 출처: 순천향대 신문 「첫발을 내딛는 신입생들을 위해」 http://news.sch.ac.kr/news/articleView.html?idxno=488\n- 多Dream비교과센터는 다면적졸업인증제 업무, 교내·외 비교과 활동의 수집·분류 및 전산관리 등을 담당합니다.\n- 위치: 충남 아산시 순천향로 22, 향설생활관1 RC306호 / 전화: 041-530-1593\n 출처: 순천향대학교 교육혁신원 多Dream비교과센터 https://inno.sch.ac.kr/sub/main_04_02", "source": "순천향대_졸업인증_관련_공식안내.md", "location": "7. ASP와 多Dream비교과센터", "department": "", "years": []}]</script>
<script>
/* ===== 졸업요건 RAG 코어 (Python rag/ 모듈의 브라우저 이식) ===== */
const GROUPS = ["대학공통", "학과기준"];
const SECTIONS = [["대학공통", "교과"], ["대학공통", "비교과"], ["학과기준", "교과"], ["학과기준", "졸업필수활동"], ["학과기준", "비교과지정"], ["학과기준", "비교과미지정"]];
const KINDS = SECTIONS.map(([g, k]) => `${g}·${k}`);
const CATEGORIES = ["소통하는 공감인재", "융합하는 창의인재", "공헌하는 글로벌인재"];

function norm(s) {
  s = String(s ?? "");
  const map = { "Ⅰ": "1", "Ⅱ": "2", "Ⅲ": "3", "Ⅳ": "4", "ㆍ": "", "·": "", "•": "" };
  s = s.replace(/[ⅠⅡⅢⅣㆍ·•]/g, (m) => map[m]);
  s = s.replace(/[\s\-_,./:;'"`~!?·&]/g, "");
  return s.toLowerCase();
}

function normalizeCourse(raw) {
  let s = String(raw).trim();
  s = s.replace(/^\s*[-*•\d]+[.)]\s*/, "");
  s = s.replace(/\[[^\]]*\]/g, "");
  s = s.replace(/\([^)]*\)/g, "");
  s = s.replace(/\s+(A\+|A0|A|B\+|B0|B|C\+|C0|C|D\+|D0|D|F|P|NP|S|U)\s*$/i, "");
  s = s.replace(/\s*\d+(\.\d+)?\s*학점\s*/g, "");
  return norm(s);
}

function parseCourseList(input) {
  const parts = Array.isArray(input) ? input : String(input || "").split(/[\n,，;]+/);
  const out = [];
  for (const p of parts) { const n = normalizeCourse(p); if (n && !out.includes(n)) out.push(n); }
  return out;
}

function resolveDepartment(name, REQ) {
  const q = norm(name);
  if (!q) return null;
  const depts = Object.entries(REQ.departments);
  for (const [d, info] of depts) if ([d, ...(info.aliases || [])].some((c) => norm(c) === q)) return d;
  for (const [d, info] of depts)
    if ([d, ...(info.aliases || [])].some((c) => norm(c).length >= 2 && (q.includes(norm(c)) || norm(c).includes(q)))) return d;
  return null;
}

function parseYear(v) {
  const m = String(v ?? "").match(/\d{2,4}/);
  if (!m) return null;
  let y = parseInt(m[0], 10);
  if (y < 100) y += 2000;
  return y;
}

const yr = (a, b) => (a === b ? `${a}` : `${a}~${b}`);

function getRequirementItems(dept, year, REQ) {
  const track = REQ.departments[dept].tracks.find((t) => t.years[0] <= year && year <= t.years[1]);
  if (!track) {
    const avail = REQ.departments[dept].tracks.map((t) => yr(t.years[0], t.years[1])).join(", ");
    return { error: `${dept} ${year}학번 기준은 안내문에 없습니다. (안내된 학번: ${avail})` };
  }
  let common = REQ.common.find((c) => c.years[0] <= year && year <= c.years[1]);
  const warnings = [];
  if (!common) {
    common = REQ.common[0];
    warnings.push(`${year}학번의 대학공통 세부 항목은 안내문에 없어 2019~2022 기준으로 계산했습니다. 多Dream비교과센터에 확인하세요.`);
  }
  const info = REQ.departments[dept];
  // 구분 2단계: 대학공통(교과·비교과) / 학과기준(교과·졸업필수활동·비교과지정·비교과미지정)
  const ov = track.common_overrides || {};
  const items = [
    ...common.items.map((it) => ({ ...it, group: "대학공통", kind: it.type === "course" ? "교과" : "비교과", ...(ov[it.id] || {}) })),
    ...track.items.map((it) => ({ ...it, group: "학과기준" })),
  ].map((it) => ({ ...it, section: `${it.group}·${it.kind}` }));
  const groups = Object.fromEntries(GROUPS.map((g) => [g, items.filter((i) => i.group === g).reduce((a, i) => a + i.points, 0)]));
  const sections = {};
  for (const sec of KINDS) { const v = items.filter((i) => i.section === sec).reduce((a, i) => a + i.points, 0); if (v) sections[sec] = v; }
  return { department: dept, year, trackYears: track.years, total: track.total, subtotals: track.subtotals, groups, sections,
    items, unitRules: info.unit_rules || "", notes: info.notes || [], warnings };
}

function evalItem(it, courses, act, used) {
  const pts = it.points;
  switch (it.type) {
    case "course": {
      const names = (it.match || [it.name]).map(norm);
      const hit = courses.find((c) => names.includes(c));
      if (hit) { used.add(hit); return [pts, "수강 리스트에서 확인"]; }
      return act ? [pts, "직접 체크"] : [0, "미이수"];
    }
    case "check": return act ? [pts, "체크됨"] : [0, "미이수"];
    case "all_of": {
      const parts = it.parts;
      const done = act === true ? [...parts] : Array.isArray(act) ? parts.filter((p) => act.includes(p))
        : act && typeof act === "object" ? parts.filter((p) => act[p]) : [];
      return [done.length === parts.length ? pts : 0, `${done.join(", ") || "없음"} 이수 (${parts.join(", ")} 모두 필요)`];
    }
    case "count": {
      const n = parseInt(act || 0, 10) || 0;
      const need = Math.ceil(pts / it.per);
      return [Math.min(n * it.per, pts), `${n}${it.unit || "회"} 참여 (회당 ${it.per}점, 필요 ${need}${it.unit || "회"})`];
    }
    case "choose": {
      let done;
      if (it.pattern) { const p = norm(it.pattern); done = courses.filter((c) => c.includes(p)); }
      else { const opts = [...it.options, ...(it.substitutes || [])].map(norm); done = courses.filter((c) => opts.includes(c)); }
      const extra = Array.isArray(act) ? act.map(normalizeCourse) : [];
      done = [...new Set([...done, ...extra])];
      done.forEach((c) => used.add(c));
      const k = Math.min(done.length, it.n);
      return [k * (pts / it.n), `${done.length}과목 확인 (${done.join(", ") || "없음"}) / ${it.n}과목 필요`];
    }
    case "points": {
      if (typeof act === "number") return [Math.min(act, pts), `입력 점수 ${act}점`];
      const a = act || {}, sv = a.subitems || {};
      let total = 0; const parts = [];
      for (const s of it.subitems || []) {
        const v = sv[s.name];
        if (!v) continue;
        const p = s.mode === "check" ? s.points
          : s.mode === "select" ? (typeof v === "number" ? v : s.options[v] || 0)
          : s.mode === "count" ? (parseInt(v, 10) || 0) * s.per : parseFloat(v) || 0;
        total += p; parts.push(`${s.name} ${p}점`);
      }
      const other = parseFloat(a.other || 0) || 0;
      if (other) { total += other; parts.push(`${(it.subitems || []).length ? "기타" : "취득"} ${other}점`); }
      return [Math.min(total, pts), (parts.join(", ") || "인정 점수 없음") + ` (합 ${total}점)`];
    }
    case "topcit_rule": {
      const a = act || {}, att = parseInt(a.attempts || 0, 10) || 0, lv = parseInt(a.level || 0, 10) || 0;
      const ok = att >= 5 || (att >= 3 && lv >= 2) || (att >= 1 && lv >= 3) || lv >= 4;
      return [ok ? pts : 0, `응시 ${att}회, 최고 Lv${lv} (기준: 응시5회 / 3회+Lv2 / 1회+Lv3 / Lv4)`];
    }
  }
  throw new Error("unknown type " + it.type);
}

function checkGraduation(department, year, courses, activities, REQ) {
  const dept = resolveDepartment(department, REQ);
  if (!dept) return { error: `'${department}' 학과를 찾지 못했습니다. 가능: ${Object.keys(REQ.departments).join(", ")}` };
  const y = parseYear(year);
  if (!y) return { error: `학번 '${year}'을(를) 해석하지 못했습니다.` };
  const spec = getRequirementItems(dept, y, REQ);
  if (spec.error) return spec;
  const list = parseCourseList(courses || []);
  activities = activities || {};
  const used = new Set();
  const items = spec.items.map((it) => {
    const [earned, detail] = evalItem(it, list, activities[it.id], used);
    return { id: it.id, name: it.name, category: it.category, group: it.group, kind: it.kind, section: it.section, required: it.points,
      earned: Math.round(earned * 100) / 100, passed: earned >= it.points - 1e-9, detail };
  });
  const sum = (arr, f) => Math.round(arr.reduce((a, r) => a + r[f], 0) * 100) / 100;
  const byGroup = Object.fromEntries(GROUPS.map((g) => { const rs = items.filter((r) => r.group === g); return [g, { required: sum(rs, "required"), earned: sum(rs, "earned") }]; }));
  const byKind = {};
  for (const sec of Object.keys(spec.sections)) { const rs = items.filter((r) => r.section === sec); byKind[sec] = { required: sum(rs, "required"), earned: sum(rs, "earned") }; }
  const byCategory = {};
  for (const c of CATEGORIES) byCategory[c] = {
    required: items.filter((r) => r.category === c).reduce((a, r) => a + r.required, 0),
    earned: Math.round(items.filter((r) => r.category === c).reduce((a, r) => a + r.earned, 0) * 100) / 100 };
  const totalReq = items.reduce((a, r) => a + r.required, 0);
  const totalEarned = Math.round(items.reduce((a, r) => a + r.earned, 0) * 100) / 100;
  return { department: dept, year: y, totalRequired: totalReq, totalEarned, passed: items.every((r) => r.passed),
    byGroup, byKind, byCategory, items,
    missing: items.filter((r) => !r.passed).map((r) => ({ name: r.name, kind: r.kind, group: r.group, section: r.section, category: r.category,
      need: Math.round((r.required - r.earned) * 100) / 100, detail: r.detail })),
    unmatchedCourses: list.filter((c) => !used.has(c)), warnings: spec.warnings,
    notes: [...spec.notes, ...(spec.unitRules ? [spec.unitRules] : [])] };
}

function formatResultText(r) {
  if (r.error) return "⚠️ " + r.error;
  const L = [`[${r.department} ${r.year}학번] 다면적 졸업인증제 판정`,
    `총점 ${r.totalEarned} / ${r.totalRequired}  →  ${r.passed ? "✅ 충족" : "❌ 미충족"}`,
    "구분별: " + GROUPS.map((g) => `${g} ${r.byGroup[g].earned}/${r.byGroup[g].required} (` +
      Object.entries(r.byKind).filter(([k]) => k.startsWith(g)).map(([k, v]) => `${k.split("·")[1]} ${v.earned}/${v.required}`).join(", ") + ")").join(" / "),
    "인재상별: " + CATEGORIES.map((c) => `${c} ${r.byCategory[c].earned}/${r.byCategory[c].required}`).join(", ")];
  if (r.missing.length) { L.push("부족한 항목:"); r.missing.forEach((m) => L.push(`  - [${m.section}/${m.category}] ${m.name}: ${m.need}점 부족 (${m.detail})`)); }
  if (r.unmatchedCourses.length) L.push("졸업인증 항목과 무관한 수강 과목: " + r.unmatchedCourses.join(", "));
  r.warnings.forEach((w) => L.push("※ " + w));
  return L.join("\n");
}

function compactRequirements(department, year, REQ) {
  const d = resolveDepartment(department, REQ);
  if (!d) return { error: `학과 '${department}'를 찾지 못함. 가능: ${Object.keys(REQ.departments).join(", ")}` };
  const spec = getRequirementItems(d, parseYear(year), REQ);
  if (spec.error) return spec;
  return { department: d, year: spec.year, total: spec.total, groups: spec.groups, sections: spec.sections, unit_rules: spec.unitRules, notes: spec.notes,
    items: spec.items.map((it) => {
      const x = { id: it.id, name: it.name, section: it.section, category: it.category, type: it.type, points: it.points };
      if (it.type === "count") x.per = it.per;
      if (it.type === "choose") { x.options = it.options || `'${it.pattern}' 포함 과목`; x.n = it.n; }
      if (it.type === "all_of") x.parts = it.parts;
      if (it.type === "points" && it.subitems?.length) x.subitems = it.subitems.map((s) => {
        const o = { name: s.name, mode: s.mode };
        if ("points" in s) o.points = s.points; if ("per" in s) o.per = s.per; if (s.options) o.options = s.options;
        return o; });
      return x;
    }) };
}

/* ---------- 검색: 문자 n-gram(2~4, 단어 경계) TF-IDF + 학과/학번 부스팅 ---------- */
function charWbNgrams(text) {
  const grams = new Map();
  for (const w of String(text).toLowerCase().split(/\s+/).filter(Boolean)) {
    const p = ` ${w} `;
    for (let n = 2; n <= 4; n++) {
      if (p.length < n) break;
      for (let i = 0; i + n <= p.length; i++) { const g = p.slice(i, i + n); grams.set(g, (grams.get(g) || 0) + 1); }
    }
  }
  return grams;
}

function buildIndex(chunks) {
  const N = chunks.length, df = new Map();
  const tfs = chunks.map((c) => { const g = charWbNgrams(c.text); for (const k of g.keys()) df.set(k, (df.get(k) || 0) + 1); return g; });
  const idf = new Map(); for (const [k, v] of df) idf.set(k, Math.log((1 + N) / (1 + v)) + 1);
  const vec = (g) => { const v = new Map(); let s = 0;
    for (const [k, tf] of g) { const w = idf.get(k); if (!w) continue; const x = (1 + Math.log(tf)) * w; v.set(k, x); s += x * x; }
    s = Math.sqrt(s) || 1; for (const k of v.keys()) v.set(k, v.get(k) / s); return v; };
  return { chunks, vecs: tfs.map(vec), vec };
}

function detectProfile(q, REQ) {
  let dept = null, best = 0; const nq = norm(q);
  for (const [d, info] of Object.entries(REQ.departments))
    for (const a of [d, ...(info.aliases || [])]) { const na = norm(a); if (na.length >= 2 && nq.includes(na) && na.length > best) { dept = d; best = na.length; } }
  let m = q.match(/(20)?(\d{2})\s*학번/), year = m ? parseYear(m[0]) : null;
  if (!year) { m = q.match(/\b(20[12]\d)\b/); year = m ? parseInt(m[1], 10) : null; }
  return [dept, year];
}

function search(index, q, k, department, year, REQ) {
  const [d2, y2] = detectProfile(q, REQ);
  if (d2 && d2 !== department) { department = d2; year = y2 || null; }   // 질문에 적힌 학과·학번 우선
  else { department = department || d2; year = y2 || year; }
  const qv = index.vec(charWbNgrams(q));
  const scores = index.chunks.map((c, i) => {
    let s = 0; const dv = index.vecs[i];
    for (const [g, w] of qv) { const x = dv.get(g); if (x) s += x * w; }
    if (department && c.department) s += c.department === department ? 0.04 : -0.08;
    if (year && c.years.length) s += c.years[0] <= year && year <= c.years[1] ? 0.03 : -0.05;
    return s;
  });
  const pinned = [];
  if (year) index.chunks.forEach((c, i) => {
    if (c.years.length && c.years[0] <= year && year <= c.years[1] && (c.department === "" || (department && c.department === department))) pinned.push(i);
  });
  const order = scores.map((s, i) => i).sort((a, b) => scores[b] - scores[a]).filter((i) => !pinned.includes(i));
  const nFree = Math.max(k - pinned.length, 2);
  let free = order.slice(0, nFree);
  if (order.length) {   // 출처 다양성: 결과에 없는 문서의 최고 청크가 충분히 관련 있으면 포함
    const best = scores[order[0]];
    const shown = new Set([...pinned, ...free].map((i) => index.chunks[i].source));
    for (const i of order.slice(nFree)) {
      const src = index.chunks[i].source;
      if (!shown.has(src) && scores[i] >= 0.6 * best) { free = free.length >= nFree ? [...free.slice(0, -1), i] : [...free, i]; shown.add(src); }
    }
  }
  const byScore = (a, b) => scores[b] - scores[a];
  const top = [...pinned.sort(byScore), ...free.sort(byScore)];
  return top.filter((i) => scores[i] > 0 || pinned.includes(i)).map((i) => ({ chunk: index.chunks[i], score: scores[i] }));
}

function formatContext(hits) {
  return hits.map((h, i) => `[문서 ${i + 1}] 출처: ${h.chunk.source} / ${h.chunk.location}\n${h.chunk.text}`).join("\n\n");
}

if (typeof module !== "undefined") module.exports = { CATEGORIES, GROUPS, SECTIONS, norm, parseCourseList, resolveDepartment, parseYear, getRequirementItems,
  checkGraduation, formatResultText, compactRequirements, buildIndex, search, detectProfile, KINDS };

          return `<label>${esc(sb.name)} <input type="number" min="0" value="0" id="${sid}" data-id="${it.id}" data-t="sub" data-sub="${esc(sb.name)}"></label>`;
        }).join("")}<label>기타 인정 점수 <input type="number" min="0" value="0" id="${id}-other" data-id="${it.id}" data-t="other"></label></div>`;
      } else if (it.type === "topcit_rule") {
        ctrl = `<label class="small">응시 <input type="number" min="0" value="0" id="${id}-att" data-id="${it.id}" data-t="att">회</label>
                <label class="small">최고 수준 <select id="${id}-lv" data-id="${it.id}" data-t="lv">${[0, 1, 2, 3, 4, 5].map((l) => `<option value="${l}">Lv${l}</option>`).join("")}</select></label>`;

      }
      html.push(`<div class="item" id="row-${it.id}"><span class="name"><span class="cat c${CATEGORIES.indexOf(it.category)}">${CAT_SHORT[it.category].replace("인재", "")}</span>${esc(it.name)} <span class="score" id="sc-${it.id}">0 / ${fmt(it.points)}점</span></span><span class="ctrl">${ctrl}</span>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}${extra}</div>`);
    }
    html.push(`</div>`);
  }
  $("#form").innerHTML = html.join("");
}

function collectActs() {
  const acts = {};
  document.querySelectorAll("#form [data-id]").forEach((el) => {
    const id = el.dataset.id, t = el.dataset.t;
    if (t === "bool") acts[id] = el.checked;
    else if (t === "int") acts[id] = +el.value || 0;
    else if (t === "list" || t === "part") { acts[id] = acts[id] || []; if (el.checked) acts[id].push(el.value); }
    else if (t === "sub") { acts[id] = acts[id] || { subitems: {}, other: 0 }; acts[id].subitems[el.dataset.sub] = el.type === "checkbox" ? el.checked : el.tagName === "SELECT" ? el.value : +el.value || 0; }
    else if (t === "other") { acts[id] = acts[id] || { subitems: {}, other: 0 }; acts[id].other = +el.value || 0; }
    else if (t === "att") { acts[id] = acts[id] || {}; acts[id].attempts = +el.value || 0; }
    else if (t === "lv") { acts[id] = acts[id] || {}; acts[id].level = +el.value || 0; }
  });
  return acts;
}

/* ---------------- 마크다운 (간단) ---------------- */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[문서\s*(\d+)\]/g, '<span class="cite">문서 $1</span>')
    .replace(/&lt;&lt;(.+?)&gt;&gt;/g, '<span class="cite">$1</span>')
    .replace(/(^|\s)_(.+?)_(?=\s|$)/g, '$1<em class="muted">$2</em>');
}
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, j) => `<tr>${cells(r).map((c) => j === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`); continue; }
    if (/^#{1,4}\s/.test(l)) { out.push(`<h4>${inline(l.replace(/^#+\s/, ""))}</h4>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) { const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(```|\s*\||#{1,4}\s|\s*([-*•]|\d+[.)])\s+)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

    inputSchema: { type: "object", properties: { department: { type: "string" }, admission_year: { type: "integer" },

/* AI가 없을 때: 검색된 청크에서 질문과 가장 가까운 '줄'만 골라 보여준다 (추출형 답변) */
const META_CHUNK = INDEX.chunks.find((c) => c.location === "일반 안내");
function keyLines(q, hits, n = 5) {
  const strip = q.replace(/(\d{2,4})\s*학번/g, "");
  const qv = INDEX.vec(charWbNgrams(strip));
  const cand = [];
  // 줄 단위 추출은 학과 기준표(구조화)와 일반 안내에서만. 공식안내 문서(.md)는 섹션 통째로 보여준다
  const pool = [...hits.map((h) => h.chunk).filter((c) => !c.location.startsWith("p.") && !c.source.endsWith(".md")), META_CHUNK].filter(Boolean);
  for (const c of pool) for (const line of c.text.split("\n")) {
    const t = line.replace(/^-\s*/, "").trim();
    if (t.length < 4 || /^(#|\[.*\]$|출처|\|[\s:|-]+\|$)/.test(t)) continue;   // 제목·출처·표 구분선 제외
    const lv = INDEX.vec(charWbNgrams(t)); let s = 0;
    for (const [g, w] of qv) { const x = lv.get(g); if (x) s += x * w; }
    cand.push({ t, s, loc: c.location });
  }
  const seen = new Set();
  cand.sort((a, b) => b.s - a.s);
  const cut = Math.max(0.05, (cand[0]?.s || 0) * 0.6);   // 가장 관련 높은 줄 대비 상대 기준
  return cand.filter((x) => x.s >= cut && !seen.has(x.t) && seen.add(x.t)).slice(0, n);
}

function offlineAnswer(q, hits) {
  const parts = [];
  const wantsCheck = /졸업\s*가능|충족|부족|남은|모자|채우/.test(q);
  if (wantsCheck && state.touched && state.lastCheck && !state.lastCheck.error)
    parts.push(`**자가진단 결과**\n\`\`\`\n${formatResultText(state.lastCheck)}\n\`\`\``);
  else if (wantsCheck) parts.push("졸업 가능 여부는 **졸업 자가진단** 탭에서 과목과 활동을 입력하면 바로 계산돼요.");
  const wantsAll = /전체|기준|요건|알려/.test(q) && !/몇|어디|뭐|무엇/.test(q);
  const lines = keyLines(q, hits, wantsAll ? 0 : 5);
  // 공식안내 문서(.md) 섹션이 상위에 걸리면 그 섹션 전체(표 포함)를 보여준다
  const isMd = (loc) => hits.some((h) => h.chunk.location === loc && h.chunk.source.endsWith(".md"));
  const topScore = Math.max(...hits.map((h) => h.score));
  const mdHit = hits.find((h) => h.chunk.source.endsWith(".md") && h.score >= 0.6 * topScore);
  if (mdHit) {
    const sec = mdHit.chunk;
    const other = lines.filter((l) => !isMd(l.loc)).slice(0, 2);
    if (other.length) parts.push(`**${state.dept} ${state.year}학번 기준표**\n` + other.map((l) => `- ${l.t} <<${l.loc}>>`).join("\n"));
    const body = sec.text.split("\n").filter((l) => !/^\[.*\]$/.test(l.trim()) && !/^##\s/.test(l)).join("\n");
    parts.push(`**${sec.location}** <<${sec.source.replace(/\.md$/, "")}>>\n\n${body}`);
  } else if (lines.length) {
    parts.push(`**${state.dept} ${state.year}학번 기준으로 안내문에서 찾은 내용이에요.**`);
    parts.push(lines.map((l) => `- ${l.t} <<${l.loc}>>`).join("\n"));
  } else {
    const top = hits.find((h) => !h.chunk.location.startsWith("p.")) || hits[0];
    if (top) parts.push(`**[문서 1] ${top.chunk.location}**\n\`\`\`\n${top.chunk.text.slice(0, 1200)}\n\`\`\``);
  }
  parts.push("_검색 모드: 안내문에서 질문과 가장 가까운 내용을 찾아 보여드렸어요._");
  return parts.join("\n\n");
}

async function ask(q) {
  q = q.trim(); if (!q || state.busy) return;
  state.busy = true; $("#send").disabled = true; $("#q").value = "";
  addMsg("user", esc(q).replace(/\n/g, "<br>"));
  const hits = search(INDEX, q, 5, state.dept, state.year, REQ);
  const bubble = addMsg("bot", `<span class="thinking">문서를 찾는 중…</span>`);
  const sample = aiOff ? null : await getSample();
  let text = "", sources = [...hits], trace = [];
  if (!sample) {
    setMode(false);
    text = offlineAnswer(q, hits);
  } else {
    const ctx = [`[학생 프로필] 학과: ${state.dept}, 학번: ${state.year}`];
    if (state.touched && state.lastCheck && !state.lastCheck.error) ctx.push(`[학생이 자가진단 탭에서 입력한 최근 판정 결과]\n${formatResultText(state.lastCheck)}`);
    const final = `${PROMPT}\n\n${ctx.join("\n\n")}\n\n[참고 문서]\n${formatContext(hits)}\n\n[질문]\n${q}`;
    const messages = [...state.history.slice(-8), { role: "user", content: final }];
    try {
      const res = await sample(messages, { tools: TOOLS(sources, trace), cache: false, modelTier: "default",
        onText: ({ text: t }) => { bubble.innerHTML = t ? md(t) : `<span class="thinking">답변을 정리하는 중…</span>`; $("#msgs").scrollTop = $("#msgs").scrollHeight; } });
      text = res.text || "";
    } catch (e) {
      if (e && e.code === "not_granted") { aiOff = true; setMode(false); text = offlineAnswer(q, hits); }
      else if (e && e.code === "rate_limited") text = "질문이 몰려 잠시 답변할 수 없어요. 조금 뒤에 다시 보내 주세요.\n\n" + offlineAnswer(q, hits);
      else text = (e && e.text) ? e.text : "답변을 만들지 못했어요. 다시 시도해 주세요.\n\n" + offlineAnswer(q, hits);
    }
  }
  const seen = new Set(); sources = sources.filter((h) => { const k = h.chunk.id; if (seen.has(k)) return false; seen.add(k); return true; });
  bubble.innerHTML = md(text) + metaHtml(sources.slice(0, 6), trace);
  state.history.push({ role: "user", content: q }, { role: "assistant", content: text });
  state.busy = false; $("#send").disabled = false; $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
